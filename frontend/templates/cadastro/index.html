<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta | garagem.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="signup-title">
      <div class="brand">garagem.</div>
      <h1 id="signup-title">Criar conta</h1>
      <p>Cadastre-se para acompanhar seus veículos.</p>

      <form id="fazerCadastro" class="form-stack" action="/cadastro" method="post">
        <label class="field"><span>Nome</span>
          <input id= "nome" name="nome" autocomplete="name" required  ></label>

        <label class="field"><span>E-mail</span>
          <input id= "email" name="email" type="email" autocomplete="email" required></label>

        <label class="field"><span>Senha</span>
          <input id= "senha" name="senha" type="password" minlength="6" autocomplete="new-password" required>
          <small>Mínimo de 6 caracteres.</small>
        </label>

        <div class="notice" id="notificacao" data-message hidden role="alert"></div>

        <button class="btn btn-primary" type="submit">Criar conta</button>

      </form>
      <div class="auth-links"><span>Já tem conta?</span><a class="text-link" href="../login/">Entrar</a></div>
    </section>
  </main>

 
  <script src="../../js/sessao.js"></script>
  <script src="../../js/autenticacoes/auth-comum.js"></script>
  <script src="../../js/autenticacoes/cadastro.js"></script>
</body>
</html>
